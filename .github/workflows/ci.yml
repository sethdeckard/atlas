name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golangci-lint v2 needs action v7+; v8 requires golangci-lint
      # >= v2.1.0. CI pins golangci-lint v2.13.2; use the same version
      # locally with `make lint`.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-mode: goinstall
          args: --timeout=5m

      - name: Test
        run: go test -race ./...
